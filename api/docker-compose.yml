services:
  weatherservice:
    build:
      context: .
      dockerfile: Dockerfile
    image: steve353/weatherapi:3.5
    ports:
      - 5002:5002
    volumes:
      - ./data:/app/data
      - ./keys:/app/keys
      - ./Certs:/app/Certs
      - ./.env:/app/.env:ro
  bgservice:
    build:
      context: .
      dockerfile: Dockerfile-bg
    image: steve353/sewagescraper:1.0
    volumes:
      - ./data:/app/data